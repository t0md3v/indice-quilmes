name: Daily price check

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/playwright:v1.42.0-jammy

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: npm install

      - name: Run scraper
        run: node scrape.js

      - name: Commit updated price
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add price.json
          git commit -m "Update price" || echo "No changes"
          git push
