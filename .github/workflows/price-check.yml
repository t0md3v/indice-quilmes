name: Daily price check

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Setup Playwright
        uses: microsoft/playwright-github-action@v1

      - name: Run scraper
        run: node scrape.js

      - name: Commit updated price
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add price.json
          git commit -m "Update price" || echo "No changes"
          git push
